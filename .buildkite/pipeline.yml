# Shadow reference for the protected, image-owned mcp-squared-ci pipeline.
# Bootstrap: janus-ci bootstrap; main pushes and same-repository PRs to main.
# Both approved jobs use Node 24 and Bun 1.3.5 without credentials.
# All GitHub workflows remain authoritative and unchanged; Codecov is pending.
# Repository pipeline files are never uploaded by the agent.
steps:
  - label: 'Shadow: test and coverage (Codecov pending)'
    key: shadow-test-and-coverage
    command: janus-ci shadow-test-and-coverage
    agents:
      queue: janus-linux
    timeout_in_minutes: 360
  - label: 'Shadow: Linux standalone compile matrix'
    key: shadow-standalone-compile
    command: janus-ci shadow-standalone-compile
    agents:
      queue: janus-linux
    timeout_in_minutes: 360
